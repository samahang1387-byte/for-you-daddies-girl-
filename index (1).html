<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For my precious princess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--lav1:#cbbaf0;--lav2:#b6a2e3;--blush:#f4b6c8;--rose:#e98fae;--ink:#3d2a5c;--panel:rgba(240,233,253,.86);color-scheme:light;
--script:"Pinyon Script","Snell Roundhand","Brush Script MT",cursive;--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:linear-gradient(160deg,var(--lav1),var(--lav2));color:var(--ink);font-family:var(--serif);font-size:20px;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden}
#pattern{position:fixed;inset:0;z-index:0}
#stage1{position:fixed;inset:0;z-index:5}
.flower{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);right:4px;width:min(58vw,260px);aspect-ratio:1;border:0;background:none;padding:0;cursor:pointer;
animation:sway 5s ease-in-out infinite;transform-origin:100% 0}
@keyframes sway{50%{transform:rotate(-2.5deg)}}
.flower svg{width:100%;height:100%;overflow:visible}
.petal{transform-box:fill-box;transform-origin:center}
#go{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);transform:translateX(-50%);background:rgba(255,246,250,.75);border:1.5px solid var(--blush);
color:var(--ink);font:600 24px var(--script);padding:10px 34px;border-radius:40px;cursor:pointer;letter-spacing:.02em;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(244,182,200,.35)}}
#go:focus-visible,.flower:focus-visible,.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#dust{position:fixed;inset:0;z-index:20;pointer-events:none}
#stage2{position:relative;z-index:2;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.panel{width:100%;max-width:560px;background:var(--panel);border:1px solid #fff9;border-radius:26px;padding:30px 22px 26px;text-align:center;
box-shadow:0 0 0 6px rgba(244,182,200,.45),0 0 0 7px #d9b66a88,0 20px 50px rgba(80,50,120,.25)}
.hide{opacity:0}
h1{font:400 var(--fs,46px)/1.12 var(--script);margin:0 0 14px;transition:opacity 1s}
.stack{position:relative;width:230px;height:270px;margin:6px auto 18px;transition:opacity 1s}
.arch{width:190px;height:240px;margin:0 auto;padding:6px;border-radius:95px 95px 14px 14px;background:linear-gradient(160deg,#f4b6c8,#fff,#d9b66a);box-shadow:0 10px 24px rgba(80,50,120,.28)}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block;border-radius:89px 89px 9px 9px}
.bear{position:absolute;right:-30px;bottom:-14px;width:104px;transform:rotate(7deg);
filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 6px 7px rgba(80,50,120,.35))}
.bear.sad{animation:wob .5s 2}
@keyframes wob{25%{transform:rotate(-6deg)}75%{transform:rotate(16deg)}}
#msg{font-size:clamp(20px,5.2vw,24px);line-height:1.5;margin:0 auto 20px;max-width:30em}
#msg span{display:inline-block;opacity:0;filter:blur(7px);transform:translateY(6px);transition:opacity .9s,filter .9s,transform .9s;white-space:pre}
#msg span.on{opacity:1;filter:none;transform:none}
.btns{display:flex;flex-direction:column;gap:12px;transition:opacity 1s}
.btn{font:600 19px/1.3 var(--serif);padding:14px 18px;border-radius:16px;cursor:pointer;color:var(--ink);transition:transform .2s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.yes{background:var(--rose);border:0;box-shadow:0 6px 16px rgba(233,143,174,.5)}
.yes.glow{animation:pulse 1.6s ease-in-out infinite}
.no{background:transparent;border:1.5px solid #5a3f86}
#reply{font:italic 500 22px/1.45 var(--serif);margin:18px 0 0;min-height:1.5em}
@media (prefers-reduced-motion:reduce){.flower,#go,.yes.glow,.bear.sad{animation:none}#msg span{transition:none}}
</style>
</head>
<body>
<div id="pattern"></div>

<div id="stage1">
  <button class="flower" id="flower" aria-label="Open the flower">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <radialGradient id="pg" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#eef2ff"/><stop offset=".35" stop-color="#8fa8f5"/><stop offset="1" stop-color="#4a5fd0"/></radialGradient>
      </defs>
      <g id="stem">
        <path d="M200 0 C170 20 140 60 104 98" stroke="#5f8a5c" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse cx="172" cy="34" rx="15" ry="7" transform="rotate(-48 172 34)" fill="#7fae78"/>
        <ellipse cx="146" cy="60" rx="14" ry="6" transform="rotate(-30 146 60)" fill="#6c9d68"/>
        <ellipse cx="186" cy="14" rx="11" ry="5" transform="rotate(-55 186 14)" fill="#8dbb84"/>
      </g>
      <g class="petal" data-dx="-60" data-dy="260" data-r="-70"><ellipse cx="100" cy="56" rx="30" ry="38" fill="url(#pg)" stroke="#3c4fb5" stroke-width="1"/><path d="M100 94V32M92 90L84 40M108 90L116 40" stroke="#3c4fb5" stroke-width=".8" opacity=".55" fill="none"/></g>
      <g class="petal" data-dx="-120" data-dy="230" data-r="-120"><ellipse cx="58" cy="102" rx="33" ry="28" fill="url(#pg)" stroke="#3c4fb5" stroke-width="1"/><path d="M96 102H36M92 96L42 86M92 108L42 118" stroke="#3c4fb5" stroke-width=".8" opacity=".55" fill="none"/></g>
      <g class="petal" data-dx="90" data-dy="250" data-r="110"><ellipse cx="142" cy="102" rx="33" ry="28" fill="url(#pg)" stroke="#3c4fb5" stroke-width="1"/><path d="M104 102H164M108 96L158 86M108 108L158 118" stroke="#3c4fb5" stroke-width=".8" opacity=".55" fill="none"/></g>
      <g class="petal" data-dx="30" data-dy="280" data-r="60"><ellipse cx="100" cy="142" rx="22" ry="24" fill="url(#pg)" stroke="#3c4fb5" stroke-width="1"/><path d="M100 108V160M94 112L88 156M106 112L112 156" stroke="#3c4fb5" stroke-width=".8" opacity=".55" fill="none"/></g>
      <g id="eye"><circle cx="100" cy="100" r="11" fill="#fff"/><circle cx="100" cy="100" r="4" fill="#f4e7a8"/>
        <path d="M94 96 L80 84 M106 96 L120 84" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="80" cy="84" r="3" fill="#fff"/><circle cx="120" cy="84" r="3" fill="#fff"/></g>
    </svg>
  </button>
  <button id="go">click here</button>
</div>

<canvas id="dust"></canvas>

<main id="stage2">

<script>
(function(){
var BODY="Pardon me, for I, thy dearest man, made thee blue with my unpleasant mannerisms. I behaved so unhinged. I love thee beyond what words can measure. I assure thee I shan’t bring it up again. My princess, wouldst thou grant me thy forgiveness?";
var $=function(i){return document.getElementById(i)};
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* French Renaissance pattern: diamond lattice + fleur-de-lis */
var tile='<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><g fill="#f4b6c8" opacity=".55">'+
'<path d="M60 20C70 34 70 48 60 62C50 48 50 34 60 20Z"/><path d="M57 58C44 42 27 44 25 57C33 54 43 57 51 67Z"/><path d="M63 58C76 42 93 44 95 57C87 54 77 57 69 67Z"/>'+
'<rect x="49" y="62" width="22" height="5" rx="2"/><path d="M60 68C56 76 50 82 43 84C52 84 56 82 60 93C64 82 68 84 77 84C70 82 64 76 60 68Z"/>'+
'<circle cx="0" cy="0" r="4"/><circle cx="120" cy="0" r="4"/><circle cx="0" cy="120" r="4"/><circle cx="120" cy="120" r="4"/></g>'+
'<path d="M0 0L120 120M120 0L0 120" stroke="#f4b6c8" stroke-width="1.2" opacity=".5"/><path d="M60 0 70 10 60 20 50 10ZM60 100 70 110 60 120 50 110Z" fill="none" stroke="#f4b6c8" stroke-width="1.2" opacity=".6"/></svg>';
$('pattern').style.backgroundImage='url("data:image/svg+xml,'+encodeURIComponent(tile)+'")';

/* build the message word by word */
var msg=$('msg'),spans=[];
BODY.split(' ').forEach(function(w,i,a){var s=document.createElement('span');s.textContent=w+(i<a.length-1?' ':'');msg.appendChild(s);spans.push(s)});

function fit(){$('h1').style.setProperty('--fs',Math.min(54,innerWidth*0.105)+'px')}
fit();addEventListener('resize',fit);

var cv=$('dust'),cx=cv.getContext('2d'),started=false;
function size(){var d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
size();addEventListener('resize',size);

function reveal(){
  $('h1').classList.remove('hide');
  setTimeout(function(){$('stack').classList.remove('hide')},500);
  spans.forEach(function(s,i){setTimeout(function(){s.classList.add('on')},900+i*(reduce?0:110))});
  setTimeout(function(){$('btns').classList.remove('hide')},900+spans.length*(reduce?0:110)+600);
}

function textPoints(){
  window.scrollTo(0,0);
  var r=$('h1').getBoundingClientRect(),fs=parseFloat(getComputedStyle($('h1')).fontSize);
  var o=document.createElement('canvas');o.width=innerWidth;o.height=innerHeight;var c=o.getContext('2d');
  c.font='400 '+fs+'px "Pinyon Script","Snell Roundhand",cursive';c.textAlign='center';c.textBaseline='alphabetic';c.fillStyle='#000';
  var lh=fs*1.12,y0=r.top+lh*0.8,mid=r.left+r.width/2;
  c.fillText('Greetings,',mid,y0);c.fillText('my precious little princess',mid,y0+lh);
  var d=c.getImageData(0,0,o.width,o.height).data,pts=[],step=innerWidth<500?3:4;
  for(var y=0;y<o.height;y+=step)for(var x=0;x<o.width;x+=step)if(d[(y*o.width+x)*4+3]>140)pts.push([x,y]);
  return pts;
}

function start(){
  if(started)return;started=true;
  $('go').style.transition='opacity .5s';$('go').style.opacity=0;
  if(reduce){$('stage1').style.display='none';reveal();return}
  var petals=[].slice.call(document.querySelectorAll('.petal'));
  petals.forEach(function(p,i){p.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:'translate('+p.dataset.dx+'px,'+p.dataset.dy+'px) rotate('+p.dataset.r+'deg)',opacity:0}],
    {duration:1700,delay:i*120,easing:'ease-in',fill:'forwards'})});
  $('flower').style.animation='none';
  [$('stem'),$('eye')].forEach(function(e){e.style.transition='opacity 1s .9s';e.style.opacity=0});
  var pts,P=[];
  var ready=(document.fonts&&document.fonts.load)?document.fonts.load('40px "Pinyon Script"'):Promise.resolve();
  setTimeout(function(){
    ready.then(function(){
      pts=textPoints();
      var src=petals.map(function(p){return p.getBoundingClientRect()}),fl=$('flower').getBoundingClientRect(),cols=['#6f8ff0','#b79cf0','#f4b6c8','#ffffff','#8fa8f5'];
      pts.forEach(function(t){
        var rr=Math.random()<.7?src[Math.floor(Math.random()*4)]:fl;
        P.push({x:rr.left+Math.random()*rr.width,y:rr.top+Math.random()*rr.height,vx:(Math.random()-.5)*3,vy:Math.random()*2,tx:t[0],ty:t[1],
          s:1.3+Math.random()*1.6,c:cols[Math.floor(Math.random()*cols.length)],d:1300+Math.random()*900,ph:Math.random()*6});
      });
      var t0=performance.now(),done=false;
      (function loop(now){
        var t=now-t0;cx.clearRect(0,0,innerWidth,innerHeight);
        for(var i=0;i<P.length;i++){var p=P[i];
          if(t<p.d){p.vx+=Math.sin(t/300+p.ph)*.08+.03;p.vy+=Math.cos(t/260+p.ph)*.06-.02;p.vx*=.985;p.vy*=.985}
          else{p.vx+=(p.tx-p.x)*.012;p.vy+=(p.ty-p.y)*.012;p.vx*=.86;p.vy*=.86}
          p.x+=p.vx;p.y+=p.vy;cx.fillStyle=p.c;cx.globalAlpha=.9;cx.fillRect(p.x,p.y,p.s,p.s)}
        if(t>3700&&!done){done=true;$('stage1').style.display='none';reveal();
          cv.style.transition='opacity 1.2s';setTimeout(function(){cv.style.opacity=0},700)}
        if(t<6000)requestAnimationFrame(loop);else cx.clearRect(0,0,innerWidth,innerHeight);
      })(performance.now());
    });
  },750);
}
$('go').addEventListener('click',start);$('flower').addEventListener('click',start);

/* answers */
var reply=$('reply');
$('no').addEventListener('click',function(){
  reply.textContent='Then I shall pray for thy mercy, my princess, and wait for thee with all my heart.';
  var b=$('bear');b.classList.remove('sad');void b.offsetWidth;b.classList.add('sad');
  $('yes').classList.add('glow');
});
$('yes').addEventListener('click',function(){
  reply.textContent='Thou hast mended my heart, my precious princess. I love thee beyond words can measure.';
  $('yes').disabled=true;$('no').style.display='none';$('yes').classList.remove('glow');
  cv.style.transition='none';cv.style.opacity=1;if(!reduce)rain();
});
function rain(){
  var cols=['#6f8ff0','#b79cf0','#f4b6c8','#ffffff','#e98fae'],R=[];
  for(var i=0;i<110;i++)R.push({x:Math.random()*innerWidth,y:-Math.random()*innerHeight,v:1.4+Math.random()*2.2,w:Math.random()*6,s:5+Math.random()*7,c:cols[i%5],r:Math.random()*6});
  var t0=performance.now();
  (function f(now){
    cx.clearRect(0,0,innerWidth,innerHeight);
    R.forEach(function(p){p.y+=p.v;p.x+=Math.sin(now/500+p.w)*.9;p.r+=.04;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=.9;cx.beginPath();cx.ellipse(0,0,p.s,p.s*.55,0,0,6.3);cx.fill();cx.restore()});
    if(now-t0<6500)requestAnimationFrame(f);else cx.clearRect(0,0,innerWidth,innerHeight);
  })(performance.now());
}
})();
</script>
